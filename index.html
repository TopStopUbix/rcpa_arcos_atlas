<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>D3 GeoJSON</title>
    <style>
      :root {
        --link-color: yellow;
      }

      html {
        overflow: hidden;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #111;
        color: #e6edf3;
        font-family: 'Courier New', monospace;
        font-size: 16px;
      }
      #wrap {
        height: 450px;
        display: flex;
        flex-direction: column;
      }

      #stage {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #map {
        display: block;
        width: 99.5%;
        height: 99.5%;
      }

      #blurb {
        box-sizing: border-box;
        max-width: 100%;
        margin-top: 15px;
        padding-top: 5px; 
        padding-bottom: 16px;
        border-top: 1px solid #fff;
        line-height: 1.5;
      }
      #blurb[hidden] {
        display: none;
      }
      #blurb h2 {
        margin: 0 0 0px;
        font-size: 16px;
      }
      #blurb p {
        margin: 0 0 16px;
      }

      #crumbs {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 0;
        margin: 0;
      }
      #crumbs a {
        color: var(--link-color);
        text-decoration: none;
        cursor: pointer;
      }
      a:hover {
        text-decoration: underline;
        background-color: blue;
        color: yellow;
      }

      .shape {
        fill: #111;
        stroke: #fff;
        stroke-width: 0.6;
        vector-effect: non-scaling-stroke;
        cursor: pointer;
      }
      .shape.hl {
        fill: #fff;
      }
      .shape.static {
        cursor: default;
      }

      .label {
        fill: #fff;
        paint-order: stroke;
        stroke: #000;
        stroke-width: 3px;
        stroke-linejoin: round;
        pointer-events: none;
        text-anchor: middle;
      }
      .pin {
        cursor: pointer;
      }
      .pin rect {
        fill: transparent;
      }
      .pin:hover rect {
        fill: blue;
      }
      .pin .label {
        fill: var(--link-color);
        stroke: none;
        font-size: 16px;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
      }
      .pin:hover .label {
        fill: yellow;
        text-decoration: underline;
      }

      .nund {
        color: red;
        animation: textShadow 1.6s infinite;
      }
      @keyframes textShadow {
        0% {
          text-shadow: 0.43px 0 1px #5193e1, -0.43px 0 1px #5193e1, 0 0 3px;
        }
        5% {
          text-shadow: 2.8px 0 1px #5193e1, -2.8px 0 1px #5193e1, 0 0 3px;
        }
        10% {
          text-shadow: 0.02px 0 1px rgba(0, 30, 255, 0.5),
            -0.02px 0 1px rgba(255, 0, 80, 0.3), 0 0 3px;
        }
        15% {
          text-shadow: 0.4px 0 1px rgba(0, 30, 255, 0.5),
            -0.4px 0 1px rgba(255, 0, 80, 0.3), 0 0 3px;
        }
        20% {
          text-shadow: 3.5px 0 1px rgba(0, 30, 255, 0.5),
            -3.5px 0 1px rgba(255, 0, 80, 0.3), 0 0 3px;
        }
        25% {
          text-shadow: 1.6px 0 1px #111, -1.6px 0 1px #111, 0 0 3px;
        }
        30% {
          text-shadow: 0.7px 0 1px rgba(0, 30, 255, 0.5),
            -0.7px 0 1px rgba(255, 0, 80, 0.3), 0 0 3px;
        }
        35% {
          text-shadow: 3.9px 0 1px rgba(0, 30, 255, 0.5),
            -3.9px 0 1px rgba(255, 0, 80, 0.3), 0 0 3px;
        }
        40% {
          text-shadow: 3.8px 0 1px rgba(0, 30, 255, 0.5),
            -3.7px 0 1px rgba(255, 0, 80, 0.3), 0 0 3px;
        }
        45% {
          text-shadow: 2.2px 0 1px rgba(0, 30, 255, 0.5),
            -2.2px 0 1px rgba(255, 0, 80, 0.3), 0 0 3px;
        }
        50% {
          text-shadow: 0.08px 0 1px rgba(0, 30, 255, 0.5),
            -0.08px 0 1px rgba(255, 0, 80, 0.3), 0 0 3px;
        }
        55% {
          text-shadow: 2.3px 0 1px rgba(0, 30, 255, 0.5),
            -2.3px 0 1px rgba(255, 0, 80, 0.3), 0 0 3px;
        }
        60% {
          text-shadow: 2.2px 0 1px rgba(0, 30, 255, 0.5),
            -2.2px 0 1px rgba(255, 0, 80, 0.3), 0 0 3px;
        }
        65% {
          text-shadow: 2.8px 0 1px rgba(0, 30, 255, 0.5),
            -2.8px 0 1px rgba(255, 0, 80, 0.3), 0 0 3px;
        }
        70% {
          text-shadow: 4.8px 0 1px rgba(0, 30, 255, 0.5),
            -4.8px 0 1px rgba(255, 0, 80, 0.3), 0 0 3px;
        }
        75% {
          text-shadow: 1.9px 0 1px rgba(0, 30, 255, 0.5),
            -1.9px 0 1px rgba(255, 0, 80, 0.3), 0 0 3px;
        }
        80% {
          text-shadow: 0.08px 0 1px #5193e1, -0.08px 0 1px #5193e1, 0 0 3px;
        }
        85% {
          text-shadow: 0.09px 0 1px #5193e1, -0.09px 0 1px #5193e1, 0 0 3px;
        }
        90% {
          text-shadow: 3.4px 0 1px #5193e1, -3.4px 0 1px #5193e1, 0 0 3px;
        }
        95% {
          text-shadow: 2.1px 0 1px #5193e1, -2.1px 0 1px #5193e1, 0 0 3px;
        }
        100% {
          text-shadow: 2.6px 0 1px #5193e1, -2.6px 0 1px #5193e1, 0 0 3px;
        }
      }

      #error {
        display: none;
        margin: 0;
        padding: 0;
        color: red;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <nav id="crumbs"></nav>
      <div id="error"></div>
      <div id="stage">
        <svg id="map"></svg>
      </div>
    </div>
    <article id="blurb" hidden></article>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
    <script>
      function showError(msg) {
        const el = document.getElementById('error');
        el.textContent = msg;
        el.style.display = 'block';
      }

      // Left side lowercase (used by the code), right side must match your file's keys exactly
      const CFG = {
        region: 'Region',
        subregion: 'Subregion',
        name: 'Name',
        iso: 'ISO-3',
        link: 'Link',
      };
      const state = { region: null, subregion: null };

      // Treats null, undefined and blank strings as missing
      const clean = (v) =>
        v == null || String(v).trim() === '' ? null : String(v).trim();
      const get = (f, key) => clean(f.properties?.[key]);

      const hasLink = (f) => !!get(f, CFG.link);

      let linkedIsos = null;
      const isoHasLink = (f) => {
        linkedIsos ??= new Set(
          data.features
            .filter(hasLink)
            .map((x) => get(x, CFG.iso))
            .filter(Boolean)
        );
        const iso = get(f, CFG.iso);
        return iso ? linkedIsos.has(iso) : hasLink(f);
      };

      function regionHasSubregions(region) {
        return data.features.some(
          (f) =>
            (get(f, CFG.region) ?? 'Unknown') === region &&
            get(f, CFG.subregion)
        );
      }

      // 0 = global, 1 = region (by subregion), 2 = countries.
      // A region with no subregion values skips straight to level 2.
      function currentLevel() {
        if (!state.region) return 0;
        if (!state.subregion && regionHasSubregions(state.region)) return 1;
        return 2;
      }

      function currentFeatures() {
        if (!state.region) return data.features;
        return data.features.filter(
          (f) =>
            (get(f, CFG.region) ?? 'Unknown') === state.region &&
            (!state.subregion || get(f, CFG.subregion) === state.subregion)
        );
      }

      function updateCrumbs() {
        const nav = d3.select('#crumbs');
        nav.selectAll('*').remove();

        const trail = [
          {
            text: 'Global',
            go: () => {
              state.region = null;
              state.subregion = null;
            },
          },
        ];
        if (state.region)
          trail.push({
            text: state.region,
            go: () => {
              state.subregion = null;
            },
          });
        if (state.subregion) trail.push({ text: state.subregion, go: null });

        trail.forEach((step, i) => {
          if (i > 0) nav.append('span').text('>');

          if (i === trail.length - 1) {
            // current level: plain text, not clickable
            nav.append('span').text(step.text);
          } else {
            nav
              .append('a')
              .attr('href', '#')
              .text(step.text)
              .on('click', (e) => {
                e.preventDefault();
                step.go();
                render();
              });
          }
        });
      }

      // Keys are Region or Subregion values, spelled exactly as in your file.
      const OVERRIDES = {
        EU: () => d3.geoConicEquidistant().rotate([48, -10]),
        EU1: () => d3.geoConicConformal().rotate([15, -50]),
        EU2: () => d3.geoMercator().rotate([0, 0]),
        EU5: () => d3.geoOrthographic().rotate([90, -45]),
        EA: () => d3.geoOrthographic().rotate([-84, -57]),
        EA1: () => d3.geoOrthographic().rotate([-84, -57]),
        VDT: () => d3.geoAlbersUsa(),
        LA3: () => d3.geoOrthographic().rotate([60, 18]),
        AT: () => d3.geoAzimuthalEqualArea().rotate([45, 90]),
      };

      // Optional per key. center is real-world [lon, lat] (west/south negative).
      // radius is degrees from the centre to the edge of the frame. roll spins the map.
      const FOCUS = {
        AT: { center: [0, -90], radius: 25, roll: 0 },
        EU2: { center: [5, 46], radius: 11, roll: 0 },
      };

      function makeProjection(level, fc, width, height) {
        const key = [state.subregion, state.region].find(
          (k) => k && OVERRIDES[k]
        );
        const projection = pickProjection(level, fc);
        const focus = key && FOCUS[key];

        if (!focus) return projection.fitSize([width, height], fc);

        const [lon, lat] = focus.center;
        projection
          .rotate([-lon, -lat, focus.roll ?? 0])
          .clipAngle(focus.radius + 5); // drops territories beyond the frame
        const frame = d3
          .geoCircle()
          .center(focus.center)
          .radius(focus.radius)();
        return projection.fitSize([width, height], frame);
      }

      // Centres the projection on the spherical centroid of whatever is being shown
      const centred = (fc) => {
        const [cx, cy] = d3.geoCentroid(fc);
        return d3.geoAzimuthalEqualArea().rotate([-cx, -cy]);
      };

      function pickProjection(level, fc) {
        const key = state.subregion ?? state.region;
        if (key && OVERRIDES[key]) return OVERRIDES[key]();
        if (level === 0) return d3.geoNaturalEarth1();
        const [cx] = d3.geoCentroid(fc);
        return d3.geoMercator().rotate([-cx, 0]);
        // or: return centred(fc);   // use the geoCentroid approach for every region and subregion
      }

      let BLURBS = {};

      function parseBlurbs(text) {
        const out = {};
        let key = null;
        for (const line of text.split(/\r?\n/)) {
          const m = line.match(/^#\s+(.+?)\s*$/);
          if (m) {
            key = m[1];
            out[key] = [];
          } else if (key) out[key].push(line);
        }
        for (const k in out) out[k] = out[k].join('\n').trim();
        return out;
      }

      // Writes text into a parent node, turning [text]{.nund} into <span class="nund">text</span>
      function appendRich(parent, str) {
        const re = /\[((?:[^\[\]]|\[[^\[\]]*\])+)\]\{\.nund\}/g;
        let last = 0,
          m;
        while ((m = re.exec(str)) !== null) {
          if (m.index > last)
            parent.append(document.createTextNode(str.slice(last, m.index)));
          const span = document.createElement('span');
          span.className = 'nund';
          span.textContent = m[1];
          parent.append(span);
          last = re.lastIndex;
        }
        if (last < str.length)
          parent.append(document.createTextNode(str.slice(last)));
      }

      function updateBlurb() {
        const box = d3.select('#blurb');
        const text =
          state.region && !state.subregion ? BLURBS[state.region] : null;
        box.attr('hidden', text ? null : true).html('');
        if (!text) return;
        box.append('h2').text(state.region);
        text
          .split(/\n\s*\n/)
          .forEach((p) => appendRich(box.append('p').node(), p));
      }

      function reportHeight() {
        if (window.parent === window) return;
        const wrap = document
          .getElementById('wrap')
          .getBoundingClientRect().height;
        const blurb = document.getElementById('blurb');
        const h =
          wrap + (blurb.hidden ? 0 : blurb.getBoundingClientRect().height);
        window.parent.postMessage(
          {
            type: 'atlas-height',
            height: Math.ceil(h),
          },
          '*'
        );
      }

      function render() {
        const svg = d3.select('#map');
        const { width, height } = svg.node().getBoundingClientRect();
        const level = currentLevel();

        // What counts as "the same group" for hover highlighting and labels.
        // At level 1, a country with no subregion is its own group.
        const groupKey = (f) =>
          level === 0
            ? get(f, CFG.region) ?? 'Unknown'
            : level === 1
            ? get(f, CFG.subregion) ?? get(f, CFG.name)
            : get(f, CFG.name);

        const feats = currentFeatures();
        const fc = { type: 'FeatureCollection', features: feats };
        const projection = makeProjection(level, fc, width, height);
        const path = d3.geoPath(projection);

        svg.on('.zoom', null).selectAll('*').remove();
        const g = svg.append('g');

        g.selectAll('path')
          .data(feats)
          .join('path')
          .attr('class', level === 2 ? 'shape static' : 'shape')
          .attr('d', path)
          .on('mouseenter', (e, d) => {
            if (level === 2) {
              if (!isoHasLink(d)) return; // no linked shape in this ISO group
              const iso = get(d, CFG.iso);
              g.selectAll('.shape').classed('hl', (x) =>
                iso ? get(x, CFG.iso) === iso : x === d
              );
              return;
            }
            g.selectAll('.shape').classed(
              'hl',
              (x) => groupKey(x) === groupKey(d)
            );
          })
          .on('mouseleave', () => g.selectAll('.shape').classed('hl', false))
          .on('click', (e, d) => {
            if (level === 0) {
              state.region = get(d, CFG.region) ?? 'Unknown';
              state.subregion = null;
            } else if (level === 1) {
              const sub = get(d, CFG.subregion);
              if (!sub) return; // country with no subregion: nothing to drill into
              state.subregion = sub;
            } else return;
            render();
          })
          .append('title')
          .text((d) => (level === 2 ? get(d, CFG.name) : groupKey(d)));

        // One pin per ISO-3 group that has a link, placed on that group's largest shape
        const pins =
          level === 2
            ? d3
                .groups(feats, (f) => get(f, CFG.iso) ?? get(f, CFG.name))
                .map(([k, fs]) => {
                  const url = fs.map((f) => get(f, CFG.link)).find(Boolean);
                  return url
                    ? {
                        url,
                        xy: path.centroid(d3.greatest(fs, (f) => path.area(f))),
                      }
                    : null;
                })
                .filter((d) => d && d.xy.every(Number.isFinite))
            : [];

        const pinSel = g
          .selectAll('a.pin')
          .data(pins)
          .join('a')
          .attr('class', 'pin')
          .attr('href', (d) => d.url)
          .attr('target', '_top');

        pinSel
          .append('rect')
          .attr('x', -10)
          .attr('y', -10)
          .attr('width', 20)
          .attr('height', 20);
        pinSel.append('text').attr('class', 'label').text('🔎︎');

        // keep pins a constant size while the map zooms
        const placePins = (k) =>
          pinSel.attr('transform', (d) => `translate(${d.xy}) scale(${1 / k})`);
        placePins(1);

        const zoom = d3
          .zoom()
          .scaleExtent([1, 40])
          .translateExtent([
            [0, 0],
            [width, height],
          ])
          .on('zoom', (e) => {
            g.attr('transform', e.transform);
            placePins(e.transform.k);
          });
        svg.call(zoom);

        updateCrumbs();
        updateBlurb();
        reportHeight();
      }

      let data;

      function draw() {
        try {
          render();
        } catch (err) {
          showError('Could not render GeoJSON: ' + err.message);
        }
      }

      function rewind(geom) {
        const fix = (poly) =>
          d3.geoArea({ type: 'Polygon', coordinates: poly }) > 2 * Math.PI
            ? poly.map((ring) => ring.slice().reverse())
            : poly;

        if (geom.type === 'Polygon') geom.coordinates = fix(geom.coordinates);
        else if (geom.type === 'MultiPolygon')
          geom.coordinates = geom.coordinates.map(fix);
      }

      d3.json('data.geojson')
        .then((json) => {
          data = json;
          data.features = data.features.filter((f) => f.geometry);
          data.features.forEach((f) => rewind(f.geometry));

          const props = data.features[0]?.properties ?? {};
          for (const [label, key] of Object.entries(CFG)) {
            if (!(key in props)) {
              showError(
                `Property "${key}" (CFG.${label}) not found. Available keys: ${Object.keys(
                  props
                ).join(', ')}`
              );
              return;
            }
          }

          draw();
          window.addEventListener('resize', draw);
        })
        .catch((err) =>
          showError('Failed to load data.geojson: ' + err.message)
        );

      d3.text('blurbs.txt')
        .then((t) => {
          BLURBS = parseBlurbs(t);
          if (data) draw(); // blurbs arrived after the map: redraw once
        })
        .catch(() => {}); // no file or a fetch error: the map still works, with no blurbs
    </script>
  </body>
</html>
